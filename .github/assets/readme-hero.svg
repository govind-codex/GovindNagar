<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Govind Nagar Portfolio</title>
  <desc id="description">Animated banner for Govind Nagar's developer portfolio.</desc>

  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="0.5" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.3" />
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#94a3b8" opacity="0.22" />
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="35" />
    </filter>
    <clipPath id="reveal">
      <rect x="348" y="224" width="0" height="42" rx="4">
        <animate attributeName="width" from="0" to="505" dur="2.1s" begin="0.45s" fill="freeze" />
      </rect>
    </clipPath>
    <style>
      .orb-a { animation: float-a 7s ease-in-out infinite; }
      .orb-b { animation: float-b 9s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 1s steps(2, end) infinite; }
      .chip { animation: chip-in .65s ease-out both; }
      .chip:nth-child(2) { animation-delay: .12s; }
      .chip:nth-child(3) { animation-delay: .24s; }
      .chip:nth-child(4) { animation-delay: .36s; }
      @keyframes float-a { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(45px, 18px); } }
      @keyframes float-b { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-38px, -22px); } }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      @keyframes chip-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#080b12" />
  <rect width="1200" height="420" rx="28" fill="url(#dots)" />
  <circle class="orb-a" cx="215" cy="96" r="145" fill="#2563eb" opacity="0.14" filter="url(#blur)" />
  <circle class="orb-b" cx="1010" cy="325" r="165" fill="#7c3aed" opacity="0.16" filter="url(#blur)" />
  <ellipse cx="600" cy="210" rx="365" ry="205" fill="url(#glow)" opacity="0.22" />
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="url(#border)" stroke-width="3" opacity="0.72" />

  <g transform="translate(600 82)">
    <circle class="pulse" cx="-80" cy="0" r="5" fill="#34d399" />
    <text x="-65" y="5" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">AVAILABLE TO BUILD</text>
  </g>

  <text x="600" y="188" fill="#f8fafc" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="67" font-weight="760" letter-spacing="-3">GOVIND NAGAR</text>
  <g clip-path="url(#reveal)">
    <text x="600" y="253" fill="#aab4c4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="1">Backend craft · Full-stack products · Thoughtful motion</text>
  </g>
  <rect class="blink" x="854" y="229" width="3" height="29" rx="1.5" fill="#60a5fa" />

  <g transform="translate(360 308)">
    <g class="chip">
      <rect width="108" height="38" rx="19" fill="#111827" stroke="#263244" />
      <text x="54" y="25" fill="#dbeafe" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="14">Next.js</text>
    </g>
    <g class="chip" transform="translate(122)">
      <rect width="120" height="38" rx="19" fill="#111827" stroke="#263244" />
      <text x="60" y="25" fill="#dbeafe" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="14">TypeScript</text>
    </g>
    <g class="chip" transform="translate(256)">
      <rect width="108" height="38" rx="19" fill="#111827" stroke="#263244" />
      <text x="54" y="25" fill="#dbeafe" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="14">Node.js</text>
    </g>
    <g class="chip" transform="translate(378)">
      <rect width="102" height="38" rx="19" fill="#111827" stroke="#263244" />
      <text x="51" y="25" fill="#dbeafe" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="14">MongoDB</text>
    </g>
  </g>

  <g>
    <animateMotion dur="8s" repeatCount="indefinite" path="M160 305 C270 215 245 125 355 116 C465 108 475 155 535 168" />
    <path d="M0 0 24 17c1 .7.5 2-.6 2.2l-9 1.3 5 10-5 2.5-5-10-6.2 6.1c-.9.9-2.3.2-2.2-1L-1 1.3C-1.1.2 0-.7 1 0Z" fill="#fff" stroke="#080b12" stroke-width="1" />
    <g transform="translate(29 19)">
      <rect width="46" height="34" rx="17" fill="#fff" />
      <text x="23" y="23" fill="#111827" text-anchor="middle" font-family="Georgia, serif" font-size="17">hi</text>
    </g>
  </g>
</svg>
